name: Flutter Dashboard Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop-windowing-package:
    name: Desktop windowing package tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze desktop windowing package
        run: dart analyze packages/desktop_windowing

      - name: Test desktop windowing package
        run: flutter test packages/desktop_windowing/test

  document-engine-package:
    name: Document engine package analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve document engine package dependencies
        working-directory: packages/document_engine
        run: flutter pub get

      - name: Temporary formatter inspection
        run: |
          dart format \
            packages/document_engine/lib/src/rendering/pdf/pdf_document_renderer.dart \
            packages/document_engine/test/rendering/pdf_document_renderer_test.dart
          git diff -- packages/document_engine/lib/src/rendering/pdf/pdf_document_renderer.dart packages/document_engine/test/rendering/pdf_document_renderer_test.dart
      - name: Verify document engine formatting
        run: dart format --output=none --set-exit-if-changed packages/document_engine

      - name: Analyze document engine package
        working-directory: packages/document_engine
        run: dart analyze

      - name: Test document engine package
        working-directory: packages/document_engine
        run: flutter test test

  flutter-quality:
    name: Full dashboard analyze, tests and Windows compile
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [desktop-windowing-package, document-engine-package]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report Windows toolchain
        run: |
          flutter --version
          dart --version
          cmake --version

      - name: Resolve dependencies and verify lockfile
        id: resolve_dependencies
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile

      - name: Analyze complete dashboard
        run: flutter analyze lib test integration_test

      - name: Analyze Splash and Authentication delivery scope
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        run: >
          dart analyze
          lib/features/splash
          lib/features/auth
          lib/core/routing/app_routes.dart
          lib/core/routing/app_pages.dart
          lib/core/config/desktop_windowing_config.dart

      - name: Run complete Flutter test suite
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        run: flutter test

      - name: Compile Windows Debug application
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --debug --verbose
