name: Flutter Dashboard Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dashboard-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop-windowing-package:
    name: Desktop windowing package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Install Linux desktop native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze desktop windowing package
        run: dart analyze packages/desktop_windowing

      - name: Test desktop windowing package
        run: flutter test packages/desktop_windowing/test

  document-engine-package:
    name: Document engine package analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve document engine package dependencies
        working-directory: packages/document_engine
        run: flutter pub get

      - name: Apply canonical Dart formatting
        run: dart format packages/document_engine

      - name: Commit canonical formatter changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- packages/document_engine; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/document_engine
            git commit -m "style(document-engine): apply canonical Dart formatting"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_BRANCH}"
          fi

      - name: Capture canonical formatter patch
        if: always()
        run: git diff -- packages/document_engine > document-engine-format.patch

      - name: Upload canonical formatter patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-engine-format-patch
          path: document-engine-format.patch
          if-no-files-found: error

      - name: Analyze document engine package
        working-directory: packages/document_engine
        run: dart analyze

      - name: Test document engine package
        working-directory: packages/document_engine
        run: flutter test

  flutter-quality:
    name: Full dashboard analyze, tests and Windows compile
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [desktop-windowing-package, document-engine-package]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report Windows toolchain
        run: |
          flutter --version
          dart --version
          cmake --version

      - name: Resolve dependencies and verify lockfile
        id: resolve_dependencies
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile

      - name: Analyze complete dashboard
        run: flutter analyze

      - name: Analyze Splash and Authentication delivery scope
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        run: >
          dart analyze
          lib/features/splash
          lib/features/auth
          lib/core/routing/app_routes.dart
          lib/core/routing/app_pages.dart
          lib/core/config/desktop_windowing_config.dart

      - name: Run complete Flutter test suite
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        run: flutter test

      - name: Compile Windows Debug application
        if: ${{ !cancelled() && steps.resolve_dependencies.outcome == 'success' }}
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --debug --verbose
