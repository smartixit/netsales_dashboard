name: Flutter Dashboard Quality Gate

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  desktop-windowing-package:
    name: Desktop windowing package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze desktop windowing package
        run: dart analyze packages/desktop_windowing

      - name: Test desktop windowing package
        run: flutter test packages/desktop_windowing/test

  flutter-quality:
    name: Full dashboard analyze, tests and Windows compile
    runs-on: windows-latest
    timeout-minutes: 60
    needs: desktop-windowing-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Report Windows toolchain
        run: |
          flutter --version
          dart --version
          cmake --version

      - name: Resolve dependencies and verify lockfile
        run: |
          flutter pub get
          flutter pub get --enforce-lockfile

      - name: Analyze complete dashboard
        run: flutter analyze

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Compile Windows Debug application
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --debug --verbose
