name: M5 Document Engine Dependency and Formatter Sync

on:
  push:
    branches:
      - feat/document-engine-m5-report-configuration
    paths:
      - 'packages/document_engine/**'
      - '.github/workflows/m5-document-engine-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Resolve package lock and format package
        working-directory: packages/document_engine
        run: |
          flutter --version
          flutter pub get
          dart format .
      - name: Commit lockfile and formatter output
        shell: bash
        run: |
          if [[ -n "$(git status --short -- packages/document_engine)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/document_engine
            git commit -m "chore(document-engine): sync Flutter lock and Dart formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Package lock and formatting are already synchronized."
          fi
