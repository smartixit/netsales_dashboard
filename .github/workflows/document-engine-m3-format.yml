name: Temporary document engine formatter
on:
  push:
    branches:
      - feat/document-engine-visual-components-m3
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: dart format packages/document_engine
      - name: Commit formatter output when needed
        run: |
          if ! git diff --quiet -- packages/document_engine; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/document_engine
            git commit -m "style(document-engine): format expanded M3 chart tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
