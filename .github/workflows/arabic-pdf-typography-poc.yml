name: Arabic PDF Typography POC

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/document_engine/**'
      - 'packages/document_engine_poc/**'
      - '.github/workflows/arabic-pdf-typography-poc.yml'
  push:
    branches:
      - feat/document-engine-arabic-typography-m4-poc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-pdf-poc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-poc:
    name: Native POC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Toolchain
        run: |
          flutter --version
          dart --version

      - name: Resolve POC dependencies
        working-directory: packages/document_engine_poc
        run: flutter pub get

      - name: Format check
        working-directory: packages/document_engine_poc
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze POC
        working-directory: packages/document_engine_poc
        run: dart analyze

      - name: Run POC tests
        working-directory: packages/document_engine_poc
        run: flutter test test

      - name: Generate candidate PDF artifacts
        working-directory: packages/document_engine_poc
        run: dart run bin/generate_poc.dart

      - name: Upload PDF specimens and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-pdf-poc-${{ matrix.os }}
          path: packages/document_engine_poc/build/poc-artifacts/
          if-no-files-found: warn
          retention-days: 14

  payv-web-build:
    name: Payv Web compile
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Resolve dependencies
        working-directory: packages/document_engine_poc
        run: flutter pub get

      - name: Compile Payv candidate for Web
        working-directory: packages/document_engine_poc
        run: dart compile js -O2 bin/payv_web_compile.dart -o build/payv_web_compile.js
