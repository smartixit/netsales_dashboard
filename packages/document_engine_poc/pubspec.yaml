name: document_engine_poc
description: Isolated Arabic PDF typography proof of concept; not a production dependency.
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  document_engine:
    path: ../document_engine
  pdf: 3.13.1
  pdf_text_shaper: 1.1.1
  payv: 0.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/Vazirmatn-Regular.ttf
